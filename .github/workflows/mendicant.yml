# fork: MendicantCE's own builds (OpenH1's workflow, build.yml, runs only by
# hand here: it publishes OpenH1's releases, from a branch named master, in
# a container image this fork cannot read).
#
# A push to mendicant-prism that changes more than documents, and a run
# started by hand, builds the Linux x86-64 and the Windows x64 release
# builds (tools/ci_build.py), tests them as build.yml tests its own, checks
# each package and zips it (tools/mendicant/package.py), and keeps the two
# zips and their SHA256SUMS as the run's artifacts. It publishes nothing:
# no job here makes a release or a tag, and none can write to the
# repository. A release is made by hand from a run's artifacts
# (.github/mendicant_release_notes.md has its notes).
#
# What a package is checked for before it is zipped:
# - tools/fork_gate.py: its binaries hold none of OpenH1's release or crash
#   report addresses and file names (a build with them would offer to install
#   OpenH1 over itself), and name this fork;
# - the Linux binaries need no glibc newer than Ubuntu 22.04's (2.35);
# - SOURCE.txt names this run's commit;
# - MENDICANT AI's trained models are in it, the repository's own file;
# - the player's README, the licence and the third parties' notices are in
#   it, and nothing of the game's data or of a player's run is
#   (tools/fork_gate.py reads every file's first bytes for them);
# - PRISM's pack tools are in it (tools/prism_packs), and the Linux package's
#   extractor, bin/openh1-map-extract, is a static program that starts.
#
# The builds have no build number: HALO_BUILD_NUMBER is never set here, and
# a build names itself by its commit (source/main/main.c). The PRISM asset
# packs are made from the game's data: they are in no package, and no game
# data is in this repository or its runs. The tools that make them from a
# player's own data are (docs/prism_packs.md).
name: MendicantCE

on:
  push:
    branches: [mendicant-prism]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# (a newer commit's run takes the place of an older one's)
concurrency:
  group: mendicant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  CI_GUEST_LLVM_CACHE: .cache/llvm
  MODELS: port/assets/mendicant/models.aibw

jobs:
  linux:
    # Ubuntu 22.04, for its glibc (2.35): the plain image, with the packages
    # of .github/ci-image's lists (OpenH1's image is those on the same base)
    # (two builds of the whole game, debug for the tests and release)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 100
    # (bash, which the image has: a container's steps are sh's otherwise)
    defaults:
      run:
        shell: bash
    steps:
      # (git before the checkout, so that it is a clone and not an archive)
      - name: Install git
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      # (the checkout is the runner's user's, the container's steps root's)
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="$(cat .github/ci-image/packages.txt .github/ci-image/packages-x86_64.txt)"
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends $packages

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mendicant-linux-x86_64-${{ github.sha }}
          restore-keys: ccache-mendicant-linux-x86_64-

      # musl, SDL, FFmpeg and the Vulkan headers, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/linux_x86_64/third_party
          key: mendicant-linux-x86_64-third-party-${{ hashFiles('tools/android_build.py', 'tools/ffmpeg_fetch.py', 'port/third_party/ffmpeg/sources.txt', 'tools/vulkan_build.py', 'tools/linux_guest_build.py', 'port/android/patches/**') }}

      # the guests' LLVM, which configure.py fetches (tools/guest_toolchain.py)
      - uses: actions/cache@v4
        with:
          path: .cache/llvm
          key: guest-llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/guest_toolchain.py') }}

      - name: Debug
        run: python3 tools/ci_build.py linux_x86_64 debug

      # the tests that read the debug build, as build.yml's linux-x86_64 job
      # runs them: the profiling build's checks and the screenshot key's
      # files (the system's clang, for its sanitizers' runtimes); the light
      # partitions' storage, with the guests' LLVM on the PATH; the Vulkan
      # backend's core over a fake Vulkan, the VR host's OpenXR binding (its
      # headers fetched here), the VR mode's seats and effects, the texture
      # caches' idle time, display.hdr's and display.ambient_occlusion's
      # contracts
      - name: Test the build
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from tools.linux_guest_build import fetch_openxr_headers; fetch_openxr_headers(Path('build/linux_x86_64/third_party/openxr'))"
          python3 -m pytest -q -rs tools/test_profile.py tools/test_host_units.py::test_host_screenshot
          (PATH="$(python3 tools/guest_toolchain.py --cache "$CI_GUEST_LLVM_CACHE"):$PATH" python3 tools/test_light_storage.py)
          python3 -m pytest -q -rs -n auto --dist loadfile tools/test_vulkan_passes.py tools/test_host_vr_vulkan.py tools/test_vr_vehicles.py \
            tools/test_vr_effects.py tools/test_host_texture_idle.py tools/test_hdr.py tools/test_hdr_backends.py tools/test_screen_passes_samples.py \
            tools/test_ambient_occlusion_light.py

      # the 60/120 Hz scorecard on the debug build (tools/scorecard/ci.py):
      # StageKit, the rates compared, the known bugs caught (the 30 Hz gate
      # against a baseline is master's: there is none here)
      - name: Scorecard
        run: python3 tools/scorecard/ci.py

      - name: Release
        run: python3 tools/ci_build.py linux_x86_64 release

      # the fork's identity and its package's contents
      - name: Test the fork's identity and package
        run: python3 -m pytest -q -rs tools/test_fork_identity.py tools/test_profile.py::test_configuration_defines tools/test_linux_package.py tools/test_install_layout.py

      - name: Check the package
        run: |
          tree=dist/halo-linux-x86_64-release
          python3 tools/fork_gate.py "$tree"
          for file in "$tree/bin/openh1" "$tree/lib/openh1/libSDL3.so.0"; do
            newest="$(readelf -V "$file" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            echo "$file needs $newest"
            [ "$(printf '%s\n' GLIBC_2.35 "$newest" | sort -V | tail -1)" = GLIBC_2.35 ]
          done
          grep -q "commit      $GITHUB_SHA" "$tree/share/doc/openh1/SOURCE.txt"
          cmp "$MODELS" "$tree/share/openh1/mendicant_models.aibw"
          [ "$(head -c 4 "$tree/share/openh1/mendicant_models.aibw")" = AIBW ]
          [ ! -e "$tree/install.sh" ]
          strings "$tree/bin/openh1" > "$RUNNER_TEMP/strings.txt"
          grep -qx "Adam-AtlasSoftware/MendicantCE" "$RUNNER_TEMP/strings.txt"
          # (the commit the build names itself by: updater.c's and main.c's label)
          grep -qF "${GITHUB_SHA:0:12}" "$RUNNER_TEMP/strings.txt"
          grep -qF "this fork's builds do not update themselves" "$RUNNER_TEMP/strings.txt"
          # (the pack tools' extractor: static, 32-bit, and it starts: without a map it says how it is used)
          extractor="$tree/bin/openh1-map-extract"
          if readelf -d "$extractor" | grep -q NEEDED; then echo "$extractor is not static"; exit 1; fi
          status=0; "$extractor" > "$RUNNER_TEMP/extract.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/extract.txt"
          grep -q "usage: map_extract" "$RUNNER_TEMP/extract.txt"
          python3 -B "$tree/share/openh1/prism_packs/prism_packs.py" list

      # the build started, hidden, with no display, sound or network: it runs
      # through its start-up (settings, SDL, the files) until it finds no
      # game data and quits, saying so, as the Windows build's start below
      # (it quits before the lines that name the build and say that it does
      # not update itself: the check above reads those from the binary)
      - name: Start the game
        run: |
          start="$RUNNER_TEMP/start"
          rm -rf "$start"
          cp -r dist/halo-linux-x86_64-release "$start"
          mkdir -p "$start/home"
          cd "$start"
          status=0
          HOME="$start/home" HALO_HIDDEN_WINDOW=1 HALO_NO_AUDIO=1 SDL_AUDIODRIVER=dummy SDL_VIDEO_DRIVER=dummy \
            HALO_NET_ONLINE=false timeout 120 bin/openh1 > start.log 2>&1 || status=$?
          cat start.log
          echo "bin/openh1 exited with $status"
          grep -q "is not the Xbox maps" start.log
          [ "$status" = 1 ]
          # (halo.log, beside config.toml: the same lines, for a player with
          # no terminal)
          grep -q "is not the Xbox maps" halo.log
          grep -q "^halo-host: the game exited (1)" halo.log

      # (zipped here, with its files' modes, which an artifact would lose; the
      # script refuses a tree that is not a whole package)
      - name: Package
        run: python3 tools/mendicant/package.py zip linux-x86_64 dist/halo-linux-x86_64-release dist/release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: MendicantCE-PRISM-linux-x86_64
          path: dist/release/MendicantCE-PRISM-linux-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    # as build.yml's windows job: the runner has LLVM, Python and Visual
    # Studio's x64 libraries and Windows SDK; the guest's compiler is the
    # pinned LLVM configure.py downloads
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_NDK: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 5 -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          # (each download checked against the hash it had when it was pinned)
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mendicant-windows-${{ github.sha }}
          restore-keys: ccache-mendicant-windows-

      # SDL's development package, and the guest's musl, SDL3, FFmpeg and
      # headers, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: mendicant-windows-third-party-${{ hashFiles('tools/windows_build.py', 'tools/android_build.py', 'tools/ffmpeg_fetch.py', 'port/third_party/ffmpeg/sources.txt', 'port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: .cache/llvm
          key: guest-llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/guest_toolchain.py') }}

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Check the package
        run: |
          folder=dist/halo-windows-release
          python tools/fork_gate.py "$folder"
          grep -q "commit      $GITHUB_SHA" "$folder/SOURCE.txt"
          cmp "$MODELS" "$folder/mendicant_models.aibw"
          for name in halo.exe SDL3.dll openh1.assets prepared.records README.md LICENSE.txt CREDITS.md \
                      prism_packs/prism_packs.py prism_packs/GUIDE.md; do
            [ -f "$folder/$name" ] || { echo "$name is missing"; exit 1; }
          done
          python -B "$folder/prism_packs/prism_packs.py" list

      # The build started: the 64-bit host reserves the guest's memory, loads
      # the guest image and runs it through its start-up until it finds no
      # game data and quits, saying so (the runner has no game data and no
      # GPU; HALO_HIDDEN_WINDOW keeps it from asking for the data)
      - name: Start the game
        run: |
          start="$RUNNER_TEMP/start"
          rm -rf "$start"
          cp -r dist/halo-windows-release "$start"
          cd "$start"
          status=0
          HALO_HIDDEN_WINDOW=1 HALO_NET_ONLINE=false timeout 120 ./halo.exe > start.log 2>&1 || status=$?
          cat start.log
          echo "halo.exe exited with $status"
          grep -q "is not the Xbox maps" start.log
          [ "$status" = 1 ]

      # (as build.yml's windows job: the light partitions' storage, with the
      # runner's clang)
      - name: Test light storage
        run: python tools/test_light_storage.py

      - name: Package
        run: python tools/mendicant/package.py zip windows-x64 dist/halo-windows-release dist/release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: MendicantCE-PRISM-windows-x64
          path: dist/release/MendicantCE-PRISM-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # (the symbols of halo.exe and the guest image, for reading a crash's
      # log lines with tools/symbolize_crash.py: kept with the run, no part
      # of a download)
      - uses: actions/upload-artifact@v4
        with:
          name: MendicantCE-PRISM-windows-x64-symbols
          path: dist/halo-windows-release-symbols
          retention-days: 14

  tests:
    # the tests that need no build, with the guests' pinned LLVM first on the
    # PATH: the files build.yml's tests job names (in one job here, not its
    # four shards), and the fork's own that need no build either (the tests
    # that need a sanitizer's runtime, which the pinned LLVM leaves out, are
    # the linux job's, with the system's clang: tools/test_profile.py)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="$(cat .github/ci-image/packages.txt .github/ci-image/packages-x86_64.txt)"
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends $packages

      - uses: actions/cache@v4
        with:
          path: .cache/llvm
          key: guest-llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/guest_toolchain.py') }}

      - name: Test
        run: |
          PATH="$(python3 tools/guest_toolchain.py --cache "$CI_GUEST_LLVM_CACHE"):$PATH" python3 -m pytest -q -rs -n auto --dist loadfile --durations=10 \
            tools/test_host_units.py tools/test_host_pages.py tools/test_android_elf_alignment.py tools/test_guest_image_check.py \
            tools/test_check_host_imports.py tools/test_host_syscall.py tools/test_guest_layout.py tools/test_linux_guest_build.py \
            tools/test_build_errors.py tools/test_guest_toolchain.py tools/test_linux_port.py tools/test_join_page.py \
            tools/test_linux_package.py tools/test_install_layout.py tools/test_android_asm_convert.py tools/test_guest_asm_cache.py \
            tools/test_guest_branch_relax.py tools/test_host_watch_hash.py tools/test_touch_menu.py tools/harness \
            tools/test_controller_remap.py tools/test_controller_remap_context.py tools/test_net_compare.py tools/test_loading_ring.py \
            tools/test_preparation.py tools/test_progress_ownership.py tools/test_ci_test_shards.py \
            tools/test_fork_identity.py tools/test_port_settings.py tools/test_loading_assets.py tools/test_mouse_sensitivity.py \
            tools/test_prism_packs.py

  sums:
    # the two zips' SHA256SUMS, when both built and passed their checks: the
    # run's third artifact (nothing is published: see the top of this file)
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MendicantCE-PRISM-linux-x86_64
          path: dist/release

      - uses: actions/download-artifact@v4
        with:
          name: MendicantCE-PRISM-windows-x64
          path: dist/release

      # (each zip read whole, and the sums checked as a player checks them)
      - name: Sums
        run: |
          python3 tools/mendicant/package.py sums dist/release
          cd dist/release
          sha256sum -c SHA256SUMS
          for archive in MendicantCE-PRISM-linux-x86_64.zip MendicantCE-PRISM-windows-x64.zip; do
            unzip -tq "$archive"
            unzip -l "$archive"
          done
          {
            echo "Commit \`$GITHUB_SHA\`"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
